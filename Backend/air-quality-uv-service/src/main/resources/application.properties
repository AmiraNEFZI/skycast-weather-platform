spring.application.name=air-quality-uv-service
server.port=8086

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Transmettre l'état de santé à Eureka
eureka.client.healthcheck.enabled=true

# Informations du microservice
management.info.env.enabled=true
info.app.name=air-quality-uv-service
info.app.version=1.0.0
info.app.description=Microservice de gestion Air Quality et UV

# InfluxDB
influxdb.url=http://localhost:8088
influxdb.token=${INFLUXDB_TOKEN}
influxdb.org=skycast
influxdb.bucket=air_quality_uv

# Open-Meteo
openmeteo.url=https://air-quality-api.open-meteo.com/v1/air-quality